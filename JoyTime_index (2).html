const $=id=>document.getElementById(id);
function tr(a,b){return lang==='zh'?a:b}
function setLang(l){lang=l;$('zh').classList.toggle('on',l==='zh');$('fr').classList.toggle('on',l==='fr');render()}
function render(){
 $('notice').textContent=tr('扫码点餐 · 到店取餐 · 无需在线支付','Commandez par QR code · À emporter · Aucun paiement en ligne');

 $('cats').innerHTML=cats.map(c=>`<button class="cat ${cat===c.id?'on':''}" onclick="cat='${c.id}';render()">${tr(c.zh,c.fr)}</button>`).join('');

function card(p){
 const q=cart.filter(x=>x.id===p.id).reduce((s,x)=>s+x.qty,0);
 const price=p.price??p.priceM;
 return `<div class="card"><div class="pic">${p.emoji}</div><div class="info"><div class="name">${tr(p.zh,p.fr)}</div><div class="fr">${tr(p.fr,p.zh)}</div><div class="desc">${tr(p.descZh,p.descFr)}</div><div class="bottom"><span class="price">€${price.toFixed(2)}${p.priceM?'+':''}</span>${q?`<div class="qty"><button class="qbtn" onclick="quick('${p.id}',-1)">−</button><span class="qn">${q}</span><button class="qbtn plus" onclick="quick('${p.id}',1)">+</button></div>`:`<button class="add" onclick="openCustom('${p.id}')">+</button>`}</div></div></div>`;
}
function quick(id,d){
 const p=products.find(x=>x.id===id);
 if(d<0){let i=cart.findIndex(x=>x.id===id);if(i>=0){cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1)}} else if(p.type==='simple'){addItem({id:p.id,name:tr(p.zh,p.fr),price:p.price,opts:[]})} else openCustom(id);
 render();
}
function updateCartBar(){const n=cart.reduce((s,x)=>s+x.qty,0),t=cart.reduce((s,x)=>s+x.price*x.qty,0);$('count').textContent=n;$('sum').textContent=t.toFixed(2)}
function addItem(x){const same=cart.find(i=>i.key===x.key);if(same)same.qty++;else cart.push({...x,key:x.key||x.id,qty:1})}
function openCustom(id){
 const p=products.find(x=>x.id===id);editing=p;form={size:'M',toppings:[],ice:[],ingredients:[],sauces:[],sugar:'normal',basePrice:p.priceM??p.price};
 $('customTitle').textContent=tr(p.zh,p.fr);$('customOverlay').classList.add('show');drawCustom();
}
function closeCustom(){$('customOverlay').classList.remove('show')}
function toggle(arr,key,max=99){const i=form[arr].indexOf(key);if(i>=0)form[arr].splice(i,1);else if(form[arr].length<max)form[arr].push(key);drawCustom()}
function single(k,v){form[k]=v;drawCustom()}
function choice(arr,data,max){
 return data.map(x=>`<button class="choice ${form[arr].includes(x[0])?'sel':''}" onclick="toggle('${arr}','${x[0]}',${max})">${lang==='zh'?x[1]:x[2]}</button>`).join('')
}
function drawCustom(){
 const p=editing;let h='';
 if(p.type==='tea'){
  h+=`<div class="opt-title">${tr('杯型','Taille')}</div><div class="choices"><button class="choice ${form.size==='M'?'sel':''}" onclick="single('size','M')">M · €4.90</button><button class="choice ${form.size==='L'?'sel':''}" onclick="single('size','L')">L · €5.90</button></div>`;
  h+=`<div class="opt-title">${tr('甜度','Sucre')}</div><div class="choices"><button class="choice ${form.sugar==='less'?'sel':''}" onclick="single('sugar','less')">${tr('少糖','Peu sucré')}</button><button class="choice ${form.sugar==='normal'?'sel':''}" onclick="single('sugar','normal')">${tr('普通','Normal')}</button><button class="choice ${form.sugar==='more'?'sel':''}" onclick="single('sugar','more')">${tr('多糖','Très sucré')}</button></div>`;
  h+=`<div class="opt-title">${tr('Toppings','Toppings')}</div><div class="hint">${tr('第一种免费；第二种起每种 +€0.50；可选“不要 Toppings”','1er topping inclus ; puis +0,50€ chacun. Vous pouvez choisir “Sans toppings”.')}</div><div class="choices"><button class="choice ${form.toppings.length===0?'sel':''}" onclick="form.toppings=[];drawCustom()">${tr('不要 Toppings','Sans toppings')}</button>${choice('toppings',teaToppings,99)}</div>`;
  form.basePrice=form.size==='M'?p.priceM:p.priceL;
 }
 if(p.type==='poke'){
  h+=`<div class="opt-title">${tr('尺寸','Taille')}</div><div class="choices"><button class="choice ${form.size==='M'?'sel':''}" onclick="single('size','M')">M · €9.90</button><button class="choice ${form.size==='L'?'sel':''}" onclick="single('size','L')">L · €11.90</button></div>`;
  h+=`<div class="opt-title">${tr('蛋白质','Protéine')}</div><div class="hint">${tr('1 种包含；额外每种 +€2','1 protéine incluse ; +2€ par protéine supplémentaire')}</div><div class="choices">${[['salmon','三文鱼','Saumon'],['chicken','鸡肉','Poulet'],['tofu','豆腐','Tofu']].map(x=>`<button class="choice ${form.protein===x[0]?'sel':''}" onclick="single('protein','${x[0]}')">${lang==='zh'?x[1]:x[2]}</button>`).join('')}</div>`;
  h+=`<div class="opt-title">${tr('食材','Ingrédients')}</div><div class="hint">${tr('5 种包含；第 6 种起每种 +€1','5 ingrédients inclus ; +1€ par ingrédient supplémentaire')}</div><div class="choices">${choice('ingredients',pokeIngredients,99)}</div>`;
  h+=`<div class="opt-title">${tr('Toppings','Toppings')}</div><div class="choices"><button class="choice ${form.toppings.length===0?'sel':''}" onclick="form.toppings=[];drawCustom()">${tr('不要 Toppings','Sans toppings')}</button>${[['fried','炸洋葱','Oignons frits'],['whiteSesame','白芝麻','Sésame blanc'],['blackSesame','黑芝麻','Sésame noir']].map(x=>`<button class="choice ${form.toppings.includes(x[0])?'sel':''}" onclick="toggle('toppings','${x[0]}')">${lang==='zh'?x[1]:x[2]}</button>`).join('')}</div>`;
  h+=`<div class="opt-title">${tr('Sauce','Sauce')}</div><div class="hint">${tr('第一种免费；第二种起每种 +€0.50','1ère sauce incluse ; puis +0,50€ chacune')}</div><div class="choices"><button class="choice ${form.sauces.length===0?'sel':''}" onclick="form.sauces=[];drawCustom()">${tr('不要 Sauce','Sans sauce')}</button>${choice('sauces',pokeSauces,99)}</div>`;
  form.basePrice=form.size==='M'?9.9:11.9;
 }
 if(p.type==='waffle'){
  h+=`<div class="opt-title">${tr('Toppings','Toppings')}</div><div class="hint">${tr('套餐已包含的第一个 Topping 免费；额外 Topping 每种 +€1','Le premier topping inclus est gratuit ; +1€ par topping supplémentaire')}</div><div class="choices"><button class="choice ${form.toppings.length===0?'sel':''}" onclick="form.toppings=[];drawCustom()">${tr('不要 Toppings','Sans topping')}</button>${choice('toppings',toppingsW,99)}</div>`;
  h+=`<div class="opt-title">${tr('冰淇淋','Glace')}</div><div class="hint">${tr('额外每球 +€2','+2€ par boule supplémentaire')}</div><div class="choices">${choice('ice',ice,99)}</div>`;
  form.basePrice=p.price;
 }
 let extra=0;
 if(p.type==='tea')extra=Math.max(0,form.toppings.length-1)*.5;
 if(p.type==='poke')extra=Math.max(0,form.ingredients.length-5)*1+Math.max(0,form.protein&&form.proteinExtra?form.proteinExtra:0)*2+Math.max(0,form.toppings.length-1)*.5+Math.max(0,form.sauces.length-1)*.5;
 if(p.type==='waffle')extra=Math.max(0,form.toppings.length-1)*1+Math.max(0,form.ice.length-1)*2;
 const total=form.basePrice+extra;
 h+=`<div class="custom-total"><span>${tr('价格','Prix')}</span><span>€${total.toFixed(2)}</span></div><button class="confirm" onclick="confirmCustom()">${tr('加入购物车','Ajouter au panier')}</button>`;
 $('customBody').innerHTML=h;
}
function confirmCustom(){
 const p=editing;
 if(p.type==='poke'&&!form.protein){alert(tr('请选择一种蛋白质','Veuillez choisir une protéine'));return}
 if(p.type==='poke'&&form.ingredients.length>0&&form.ingredients.length<0)return;
 let extra=0;
 if(p.type==='tea')extra=Math.max(0,form.toppings.length-1)*.5;
 if(p.type==='poke')extra=Math.max(0,form.ingredients.length-5)+Math.max(0,form.toppings.length-1)*.5+Math.max(0,form.sauces.length-1)*.5;
 if(p.type==='waffle')extra=Math.max(0,form.toppings.length-1)+Math.max(0,form.ice.length-1)*2;
 let price=form.basePrice+extra;
 let opts=[];
 if(form.size)opts.push(form.size);
 if(p.type==='tea'){opts.push(form.sugar);if(form.toppings.length)opts.push((lang==='zh'?'Toppings: ':'Toppings: ')+form.toppings.join(', '))}
 if(p.type==='poke'){opts.push((lang==='zh'?'蛋白质: ':'Protéine: ')+form.protein);if(form.ingredients.length)opts.push((lang==='zh'?'食材: ':'Ingrédients: ')+form.ingredients.join(', '));if(form.sauces.length)opts.push((lang==='zh'?'Sauce: ':'Sauce: ')+form.sauces.join(', '))}
 if(p.type==='waffle'){if(form.toppings.length)opts.push('Topping: '+form.toppings.join(', '));if(form.ice.length)opts.push('Glace: '+form.ice.join(', '))}
 addItem({id:p.id,name:tr(p.zh,p.fr),price,opts,key:p.id+'|'+JSON.stringify(form)});
 closeCustom();render();
}
function openCart(){renderCart();$('cartOverlay').classList.add('show')}function closeCart(){$('cartOverlay').classList.remove('show')}
function renderCart(){
 let h='';
 if(!cart.length)h=`<div class="smallnote" style="text-align:center;padding:35px">${tr('购物车还是空的','Votre panier est vide')}</div>`;
 else cart.forEach((x,i)=>{h+=`<div class="cartitem"><div class="ctop"><span class="cname">${x.name}</span><b>€${(x.price*x.qty).toFixed(2)}</b></div>${x.opts.length?`<div class="opts">${x.opts.join(' · ')}</div>`:''}<div class="cqty"><button class="qbtn" onclick="cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);renderCart();render()">−</button><span>${x.qty}</span><button class="qbtn plus" onclick="cart[i].qty++;renderCart();render()">+</button></div></div>`});
 $('cartBody').innerHTML=h;
}
function pick(b){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pickMode=b.dataset.pick}
function submitOrder(){
 if(!cart.length){alert(tr('请先选择商品','Veuillez choisir un article'));return}
 let total=cart.reduce((s,x)=>s+x.price*x.qty,0),note=$('note').value.trim();
 let h=`<h3>${tr('订单内容','Détails de la commande')}</h3><br>`;
 cart.forEach(x=>h+=`<div style="display:flex;justify-content:space-between;margin:7px 0;gap:8px"><span>${x.name} × ${x.qty}</span><b>€${(x.price*x.qty).toFixed(2)}</b></div>`);
 h+=`<hr style="border:0;border-top:1px solid #ddd"><div style="display:flex;justify-content:space-between;font-weight:800"><span>${tr('合计','Total')}</span><span>€${total.toFixed(2)}</span></div>`;
 h+=`<p>${tr('取餐：','Retrait : ')}${pickMode==='now'?tr('马上取','Dès maintenant'):tr('稍后取','Plus tard')}</p>`;
 if(note)h+=`<p>${tr('备注：','Remarque : ')}${escapeHtml(note)}</p>`;
 $('receipt').innerHTML=h;$('cartOverlay').classList.remove('show');$('success').classList.add('show');
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function backMenu(){$('success').classList.remove('show');cart=[];$('note').value='';render()}
render();
</script>
</body>
</html>
